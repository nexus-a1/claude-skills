# =============================================================================
# Claude Skills — Project Configuration
# =============================================================================
#
# Per-project configuration for skills and agents.
# Place this file at: .claude/configuration.yml
#
# Everything is optional — skills fall back to sensible defaults when absent.
# Use /configuration-init for an interactive setup wizard.
#
# Full documentation: docs/installation.md (Per-Project Configuration section)
# =============================================================================


# -----------------------------------------------------------------------------
# Execution Mode
# -----------------------------------------------------------------------------
# Controls how multi-agent skills run parallel research phases.
#
# Two modes available:
#   "team" (default) — agents run as teammates via TeamCreate, can read each
#     other's findings and cross-pollinate insights via SendMessage.
#     Higher quality results through real-time collaboration.
#   "subagent" — agents run as independent parallel tasks.
#     Lower token cost, faster execution, no cross-pollination.
#
# Two configuration formats:
#
#   Simple (applies to all phases):
#     execution_mode: team
#
#   Per-phase (granular control):
#     execution_mode:
#       default: team
#       overrides:
#         troubleshoot: subagent   # opt out specific phases if needed
#
# Available phase names:
#   requirements_deep_dive  — /create-requirements Stage 3 (parallel research)
#   qa_review               — /implement Phase 4 (QA agents + quality-guard)
#   documentation_update    — /update-documentation Phases 2-4
#   refactor                — /refactor Step 5.1 (quality gate loop)
#   troubleshoot            — /troubleshoot Phase 6 (verification review)
#   pr_review               — /pr-review Step 4 (review agents; covers remote and --local modes)
#   review_plan             — /review-plan Step 3 (review agents; architect, quality-guard, optionally security-auditor)
#
# Only the phases listed above read execution_mode. Other multi-agent skills
# (/brainstorm, /create-proposal, /epic, /meeting, /resume-work, and others)
# use fixed execution strategies optimized for their workflow.
# Both formats are fully supported — simple string is a shorthand for
# { default: <value>, overrides: {} }.
# -----------------------------------------------------------------------------
execution_mode: team


# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# Defines WHERE artifacts are stored. Two concepts:
#
#   locations — named storage backends (git repos or local directories)
#   artifacts — maps logical artifact names to locations + subdirectories
#
# This abstraction lets you point multiple artifact types at the same
# git repository, and skills resolve paths automatically.
# -----------------------------------------------------------------------------
storage:

  # ---------------------------------------------------------------------------
  # Storage Locations
  # ---------------------------------------------------------------------------
  # Each location has:
  #   type: "git" or "directory"
  #     - git:       auto-syncs (pull before read, commit+push after write)
  #     - directory:  local only, no sync
  #   path: absolute or relative path
  #     - git locations should use absolute paths
  #     - "directory" locations can be relative to project root
  #
  # You can define as many locations as needed. Common patterns:
  #   - Single team repo for all shared artifacts
  #   - Separate repos for requirements vs product docs
  #   - Local-only setup (no git sync)
  # ---------------------------------------------------------------------------
  locations:
    team-knowledge:
      type: git                                    # git-managed shared repository
      path: /path/to/team-knowledge                # absolute path to git repo
    local:
      type: directory                              # local project directory
      path: .claude                                # relative to project root

  # ---------------------------------------------------------------------------
  # Artifact Types
  # ---------------------------------------------------------------------------
  # Maps logical artifact names to storage locations.
  # Each artifact has:
  #   location: reference to a key in storage.locations above
  #   subdir:   subdirectory within that location
  #
  # Resolved path = locations[location].path + "/" + subdir
  #
  # Example: requirements → team-knowledge → /path/to/team-knowledge/requirements
  #
  # Artifact types and what uses them:
  #   requirements      — /archive-requirements, /search-requirements, archivist
  #   proposals         — /create-proposal
  #   product-knowledge — product-expert agent
  #   brainstorms       — /brainstorm
  #   meetings          — /meeting
  #   work              — /create-requirements, /implement, /resume-work, /epic,
  #                       /create-proposal, /brainstorm promote, and any skill
  #                       that keeps a resumable session (16 components total)
  #   refactoring       — refactorer agent
  # ---------------------------------------------------------------------------
  artifacts:
    requirements:      { location: team-knowledge, subdir: requirements }
    proposals:         { location: team-knowledge, subdir: proposals }
    product-knowledge: { location: team-knowledge, subdir: . }
    brainstorms:       { location: local, subdir: brainstorm }
    meetings:          { location: local, subdir: meetings }
    work:              { location: local, subdir: work }
    refactoring:       { location: local, subdir: work/refactoring-sessions }


# -----------------------------------------------------------------------------
# Project
# -----------------------------------------------------------------------------
# Optional project-level settings consumed by skills.
#
#   ecosystem    Technology stack for this project. When set, /create-proposal
#                skips the interactive "Detected: X. Confirm?" question and uses
#                this value directly.
#
#   Supported values: php-symfony, php, react, node, go, java, python
# -----------------------------------------------------------------------------
# project:
#   ecosystem: php-symfony


# -----------------------------------------------------------------------------
# Requirements Behavior Flags
# -----------------------------------------------------------------------------
# Controls the archivist agent's behavior during workflows.
# These are separate from storage — they govern WHEN things happen,
# not WHERE they're stored.
#
# Only relevant if you have a requirements artifact configured above.
# If this entire section is absent, all flags default to their listed values.
#
#   auto_search          Search for similar past work during /create-requirements
#                        Stage 3. Shows matches to help reuse patterns and
#                        avoid re-inventing solutions.
#
#   auto_archive         When /implement finishes the ticket (Phase 6.3), offer
#                        to archive the completed requirements to the team
#                        knowledge base. Fires whether or not a PR was created.
#
#   auto_load_threshold  Confidence score (0.0–1.0) above which matched
#                        requirements are automatically loaded into context
#                        instead of just suggested. Higher = more selective.
#
#   max_suggestions      Maximum number of similar past requirements to show
#                        during the planning phase.
#
#   archive_on_pr        Offer to archive immediately after /implement opens a
#                        PR (Phase 5.3b), rather than waiting for completion.
#                        Independent of auto_archive: these are two distinct
#                        trigger points, not one flag checked twice. With both
#                        enabled (the shipped default) accepting at either
#                        point suppresses the other, so you archive once.
#                        Declining at PR creation lets the completion offer ask
#                        again — a different occasion — so the ceiling is two
#                        offers and at most one archive.
#                        Neither flag is standing consent: an unattended run
#                        that cannot obtain an explicit answer archives nothing.
#
#   workflow.enabled     Whether /create-requirements may take the orchestrated
#                        (workflow) path for its deep dive and synthesis:
#                        schema-validated discovery, a two-round deep dive over
#                        typed findings, adversarial verification before
#                        synthesis, and gates computed rather than narrated.
#                        Default: true. Setting false always falls back to the
#                        classic prose path, which remains fully supported.
#                        The path is also skipped automatically when the
#                        Workflow tool is unavailable in the session.
# -----------------------------------------------------------------------------
requirements:
  auto_search: true
  auto_archive: true
  auto_load_threshold: 0.9
  max_suggestions: 3
  archive_on_pr: true
  workflow:
    enabled: true


# -----------------------------------------------------------------------------
# Hooks (optional)
# -----------------------------------------------------------------------------
# Opt-in behavior for plugin hooks. Absent = all flags default to disabled.
#
# hooks.auto_context — PostToolUse hook that auto-appends entries to the
# active work session's state.json after milestone tool calls (Edit, Write,
# MultiEdit, Task, NotebookEdit). Complements the manual /update-context
# skill; does not replace it.
#
# Behavior:
#   - Default disabled. When enabled, auto-entries are flagged "auto": true
#     and prefixed with "[auto]" in the note.
#   - Requires an active work session registered by a session-starting skill
#     (e.g. /implement). Hook no-ops silently when no session is active.
#   - Throttled by throttle_seconds so rapid Edit bursts produce one entry.
#   - Hook never blocks tool execution; errors log to
#     $HOME/.claude/auto-context-errors.log.
#   - Requires: jq (mandatory), yq (to read this config), flock (Linux/macOS).
#
#   enabled          opt-in toggle (default: false)
#   milestone_tools  tools that trigger an entry (default below)
#   throttle_seconds minimum seconds between auto-entries per session (default 300)
# -----------------------------------------------------------------------------
# hooks:
#   auto_context:
#     enabled: false
#     milestone_tools: [Edit, Write, MultiEdit, Task, NotebookEdit]
#     throttle_seconds: 300


# -----------------------------------------------------------------------------
# Redaction (optional)
# -----------------------------------------------------------------------------
# Which STRUCTURED PII classes the redaction filter replaces with placeholders,
# on top of the credential classes it always replaces.
#
# How redaction works, in one sentence: the redact-output hook rewrites every
# Bash command so its output streams through a filter, and each matched value
# comes back as a stable <REDACTED:kind:n> placeholder that the model can refer
# to, compare and write back into a file (reverse-substitute), while the value
# itself never enters the conversation.
#
# Credentials are NOT configurable here. An API key is never task input, so
# there is no case for switching that tier off per project.
#
# The classes, and the default each one ships with:
#
#   email  true   local@domain.tld. Service addresses are exempt whatever this
#                 is set to — git@…, noreply@…, no-reply@… and
#                 *.noreply.github.com are on every git remote and commit
#                 trailer and are nobody's contact address.
#   phone  true   +… international numbers with 8-15 digits (E.164) and the
#                 dashed Polish form 123-456-789. A bare space-separated
#                 123 456 789 is NOT matched: three space-separated three-digit
#                 columns are ordinary tabular output.
#   iban   true   mod-97 checked, grouped or unseparated.
#   pesel  true   control digit AND the embedded date checked, which is what
#                 keeps an eleven-digit timestamp out.
#   nip    true   the dashed forms anywhere; ten bare digits only on a line
#                 that says NIP, because a bare ten-digit number is a unix
#                 timestamp far more often than it is a tax id.
#   card   true   13-19 digits, plain or in 4-4-4-4 / 4-6-5 groups, Luhn
#                 checked. A UUID and a long id do not match.
#   ip     FALSE  IPv4 with every octet in range. IPv6 is not covered at all.
#
# Why ip is the one that defaults OFF. The test applied to every class was:
# does a working agent need the real value more often than not? If yes it
# defaults off, because a redactor that breaks the task gets switched off
# wholesale, and a wholesale-off redactor protects nothing. Container
# addresses, 127.0.0.1, a 192.168.x home lab, a docker inspect, a failing DNS
# lookup — IP addresses are usually infrastructure rather than people, and they
# share their shape with a four-part version string, the worst false-positive
# neighbour in the set. Everything else on the list is data an agent
# essentially never needs to read back.
#
# email is the judgement call and it defaults ON: it is the class most likely
# to carry a real person's data in a repository (fixtures, seed data, CSV
# exports, support tickets). The cost, stated plainly, is that git log, git
# blame and gh output show author addresses as placeholders. Set it false in a
# project where addresses ARE the task.
#
# Per session, without editing this file (this beats the settings below):
#   NEXUS_REDACT_PII=none          secrets only
#   NEXUS_REDACT_PII=all           every class, ip included
#   NEXUS_REDACT_PII=email,card    exactly these
#
# A class name that is not one of the seven above is ignored with a note on
# stderr — a typo here is a class its author believes is on.
# -----------------------------------------------------------------------------
# redaction:
#   pii:
#     email: true
#     phone: true
#     iban: true
#     pesel: true
#     nip: true
#     card: true
#     ip: false


# -----------------------------------------------------------------------------
# Jira Integration (optional)
# -----------------------------------------------------------------------------
# Governs whether /jira (and jira-aware features, like /create-requirements
# auto-seeding from a loaded ticket) may call `acli` at all for this project.
# Set explicitly via /configuration-init — which also runs a quick acli
# installed/authenticated check at setup time — rather than discovered by
# Claude probing acli on every invocation.
#
#   enabled        Master toggle. Default true when absent — preserves
#                   existing behavior for configs written before this flag
#                   existed. Set false to skip Jira entirely; no acli
#                   invocation is attempted (plugin/shared/jira/lib.sh's
#                   jira_master_enabled, checked before jira_preflight).
#   write.enabled   /jira is read-only by default. Enabling this lets it also
#                   add a comment, transition a status, or assign/unassign a
#                   work item — always with an explicit per-write confirmation
#                   first, and always independently re-read and verified
#                   afterward before a success is reported. Refused whenever
#                   `enabled` above is false, regardless of this value.
#
# Both flags are resolved and enforced by plugin/shared/jira/lib.sh and
# jira-write.sh themselves, not by skill prose. Their defaults point opposite
# ways on purpose: `enabled` is opt-out (reads proceed unless explicitly
# false, including when the config is absent or unresolvable — this must not
# change established behavior), while `write.enabled` is opt-in and
# fail-closed (a direct script invocation cannot mutate when it is absent,
# false, or unresolvable for any reason).
#
#   enabled        opt-out toggle (default: true)
#   write.enabled  opt-in toggle (default: false)
# -----------------------------------------------------------------------------
# jira:
#   enabled: true
#   write:
#     enabled: false


# -----------------------------------------------------------------------------
# Worktree Isolation (optional)
# -----------------------------------------------------------------------------
# When enabled, code-modifying skills (/implement, /troubleshoot, /refactor) work in
# isolated git worktrees instead of the main working tree.
#
# Mode is auto-detected — no configuration needed:
#   - Inside a git repo → single-repo worktree (via EnterWorktree)
#   - Plain directory with git repos as subdirs → per-service worktrees
#
# Benefits:
#   - Your working tree stays clean while agents make changes
#   - Multiple tickets can run in parallel without branch conflicts
#   - Easy cleanup: remove the worktree directory when done
#
# Behavior:
#   - Skills enter worktrees at start, keep them after completion
#   - State files remain in the original directory for resume capability
#   - Agents work transparently — they receive absolute paths
#   - Read-only skills (brainstorm, create-requirements) are unaffected
#
#   enabled  — opt-in toggle (default: false)
#   root     — multi-repo only: where ticket workspaces live (default: .worktrees)
# -----------------------------------------------------------------------------
# worktree:
#   enabled: false
#   root: .worktrees


# -----------------------------------------------------------------------------
# Implement Deviation Checkpoint (optional)
# -----------------------------------------------------------------------------
# /implement's Phase 3.2b runs a lightweight plan-vs-diff sanity check after
# each chunk commits: did the chunk touch only its declared files, and does
# the diff plausibly match what the chunk said it would do? On a detected
# deviation it asks re-plan with architect / document and continue / abort.
#
# Unlike worktree/jira write below, this defaults ON — it's a safety check,
# not an integration you opt into. Turn it off only if it proves too noisy
# in practice.
#
#   enabled  opt-out toggle (default: true)
# -----------------------------------------------------------------------------
# implement:
#   deviation_checkpoint:
#     enabled: true


# -----------------------------------------------------------------------------
# Implement Playwright Scoping (optional)
# -----------------------------------------------------------------------------
# /implement's Phase 4.0 asks a yes/no/scope question before writing
# Playwright E2E tests, the first time frontend code is touched in a project
# with no existing Playwright config — instead of silently starting to
# generate them. Also defaults ON, like deviation_checkpoint above.
#
#   enabled  opt-out toggle (default: true) — false reverts to `default` below
#            instead of asking
#   default  only consulted when enabled: false.
#              "heuristic" (default) — detect from touched files, same as
#                the prior silent behavior; playwright-engineer may still run
#              "skip"                — never run playwright-engineer for this
#                project, regardless of which files were touched
# -----------------------------------------------------------------------------
# implement:
#   playwright_scoping:
#     enabled: true
#     default: heuristic


# -----------------------------------------------------------------------------
# Multi-Repo Workspace (optional)
# -----------------------------------------------------------------------------
# When Claude starts in a plain directory containing multiple git repositories,
# the framework auto-discovers services by scanning subdirectories for .git.
#
# Define services explicitly ONLY if you want to limit which repos are included.
# Omit entirely for single-repo projects or to use auto-discovery.
#
# Each service has:
#   name — identifier used in worktree paths and agent context
#   path — relative or absolute path to the git repo
# -----------------------------------------------------------------------------
# workspace:
#   services:
#     - name: service1
#       path: ./service1
#     - name: service2
#       path: ./service2


# =============================================================================
# Configuration Profiles
# =============================================================================
# Below are common configuration patterns. Copy the one that fits your setup
# and remove sections you don't need.
#
# --- Minimal (local only, no shared repos) ---
#
#   execution_mode: team
#   # That's it! All paths use defaults under .claude/
#
#
# --- With Requirements KB ---
#
#   execution_mode: team
#   storage:
#     locations:
#       team-knowledge:
#         type: git
#         path: /home/user/team-requirements
#       local:
#         type: directory
#         path: .claude
#     artifacts:
#       requirements: { location: team-knowledge, subdir: requirements }
#       work:         { location: local, subdir: work }
#   requirements:
#     auto_search: true
#     auto_archive: true
#
#
# --- Per-phase execution mode ---
#
#   execution_mode:
#     default: team
#     overrides:
#       troubleshoot: subagent          # opt out troubleshoot (only 2 agents, less benefit)
#
#
# --- Full (shared team repo for everything) ---
#
#   execution_mode: team
#   storage:
#     locations:
#       team-knowledge:
#         type: git
#         path: /home/user/team-knowledge
#       local:
#         type: directory
#         path: .claude
#     artifacts:
#       requirements:      { location: team-knowledge, subdir: requirements }
#       proposals:         { location: team-knowledge, subdir: proposals }
#       product-knowledge: { location: team-knowledge, subdir: . }
#       brainstorms:       { location: local, subdir: brainstorm }
#       meetings:          { location: local, subdir: meetings }
#       work:              { location: local, subdir: work }
#       refactoring:       { location: local, subdir: work/refactoring-sessions }
#   requirements:
#     auto_search: true
#     auto_archive: true
#     auto_load_threshold: 0.9
#     max_suggestions: 3
#     archive_on_pr: true
# =============================================================================
# PR REVIEW  (optional — omit entirely and /pr-review behaves exactly as before)
# =============================================================================
#
# Two independent settings. Both are optional and both have safe defaults, so
# an existing config that predates them needs no migration.
#
#   pr_review.gates              deterministic checks run BEFORE any LLM
#                                reviewer. Default: none — the phase is
#                                skipped. There is deliberately no built-in
#                                default command, because a command that makes
#                                sense in one project is meaningless in another.
#
#   pr_review.workflow.enabled   whether to use the orchestrated review path
#                                (blind fan-out + adversarial verification)
#                                when it is available. Default: true. Setting
#                                false always falls back to the classic path.
#
# --- How gates are specified, and why they look like this -------------------
#
# A gate names a TEMPLATE plus ONE argument. It does not supply a command line.
# That is a security boundary, not a stylistic choice: this file is writable by
# anyone who can open a pull request, and /pr-review may be run in a clone you
# do not control. Templates keep the set of executable commands fixed in the
# plugin, where it can be reviewed, instead of in your repository, where it
# cannot.
#
# Supported templates and what each runs:
#
#     npm_script       -> npm run <args>
#     composer_script  -> composer run-script <args>
#     make_target      -> make <args>
#     pytest           -> pytest <args>
#     go_test          -> go test <args>
#     cargo_test       -> cargo test <args>
#     bash_script      -> bash <args>          (<args> must resolve INSIDE the repo)
#
# <args> is a single token matching [A-Za-z0-9][A-Za-z0-9._:/-]* — no spaces,
# no shell metacharacters, no '..'. A check needing more than that belongs in a
# script in your repository, invoked via bash_script.
#
# Two further protections you should know about, because they affect when you
# get prompted:
#
#   * Gate definitions are read from the MERGE BASE, not your working tree.
#     A branch cannot introduce a gate that runs during its own review. The
#     practical consequence: changing gates here takes effect only once the
#     change lands on the base branch.
#
#   * The first run in a project asks you to confirm the resolved gate set, and
#     asks again whenever it changes — including when only the CONTENT of a
#     referenced script changes, with this file untouched.
#
# --- Example ---------------------------------------------------------------
#
#   pr_review:
#     gates:
#       - name: lint
#         template: npm_script
#         args: lint
#       - name: unit
#         template: npm_script
#         args: test
#       - name: validate
#         template: bash_script
#         args: scripts/validate.sh
#     workflow:
#       enabled: true
#
# =============================================================================
# TROUBLESHOOT  (optional — omit entirely and /troubleshoot behaves exactly as before)
# =============================================================================
#
#   troubleshoot.workflow.enabled   whether Phase 6.3's verification review uses
#                                   the orchestrated path (two blind verifiers on
#                                   one question each, then three challengers
#                                   refuting the reach verdict) when it is
#                                   available. Default: true. Setting false always
#                                   falls back to the classic two-agent review.
#
# What the orchestrated path changes, and why you might turn it off:
#
#   * The stated root cause stops being CONTEXT the skeptic reasons from and
#     becomes the CLAIM under test. A fix that merely suppresses the symptom is
#     reported as such, with the failure path traced and cited.
#   * It costs five agent calls per verification round instead of two. On a small
#     codebase with cheap, obvious fixes that is a poor trade; on anything where a
#     wrong root cause is expensive, it is the point.
#
# What it does NOT change: the fix is still applied only by the lead, sequentially
# (Phase 5), the commit is still the lead's (Phase 7), and the three-rejection
# deadlock protocol still fires — the counter lives in the lead precisely so that
# falling back to the classic path mid-run does not reset it.
#
# Both spellings work, and both mean the same thing:
#
#   troubleshoot:
#     workflow:
#       enabled: false
#
#   troubleshoot:
#     workflow: false


# =============================================================================
# REVIEW PLAN  (optional — omit entirely and /review-plan behaves exactly as before)
# =============================================================================
#
# One setting, with a safe default, so an existing config needs no migration.
#
#   review_plan.workflow.enabled  Whether /review-plan may take the orchestrated
#                                 (workflow) path for its review panel: each
#                                 reviewer reads the raw plan blind, findings
#                                 are typed and must cite the plan verbatim,
#                                 three challengers judge every finding before
#                                 it is reported, and the verdict is arithmetic
#                                 over what survives. Default: true. Setting
#                                 false always falls back to the classic prose
#                                 path, which remains fully supported.
#                                 The path is also skipped automatically when
#                                 the Workflow tool is unavailable in the
#                                 session.
#
# Note that execution_mode's `review_plan` phase is NOT consulted on the
# orchestrated path — a script has no teammate protocol, so `team` mode's
# cross-pollination applies to the classic path only. Set enabled: false if you
# want cross-pollination back.
#
# --- Example ---------------------------------------------------------------
#
#   review_plan:
#     workflow:
#       enabled: true
#


# =============================================================================
# EPIC  (optional — omit entirely and /epic behaves exactly as before)
# =============================================================================
#
#   epic.workflow.enabled   Whether /epic may take the orchestrated (workflow)
#                           path for Phase 2 through Phase 5.5: a blind
#                           analysis fan-out with the too-small gate computed
#                           from typed fields, a per-ticket spec PIPELINE (each
#                           ticket is verified while the next is still being
#                           written), and an adversarial check of the wave
#                           assignment against the generated specs.
#                           Default: true. Setting false always falls back to
#                           the classic prose path, which remains fully
#                           supported. The path is also skipped automatically
#                           when the Workflow tool is unavailable in the
#                           session.
#
#                           Phase 1's questions, every file write, the epic
#                           structure in Phase 6 and the manifest upsert in
#                           Phase 6.5 stay in the orchestrator on both paths.
#
# --- Example ---------------------------------------------------------------
#
#   epic:
#     workflow:
#       enabled: true
#


# =============================================================================
# REFACTOR  (optional — omit entirely and /refactor behaves exactly as before)
# =============================================================================
#
#   refactor.workflow.enabled   Whether /refactor may take the orchestrated
#                               (workflow) path for Iteration Step A of the
#                               Step 5.1 quality gate: three reviewers read the
#                               applied diff blind, every finding is put to
#                               three challengers, and the pass/fail verdict is
#                               arithmetic over what survives rather than an
#                               agent's summary.
#                               Default: true. Setting false always falls back
#                               to the classic prose path, which remains fully
#                               supported. The path is also skipped
#                               automatically when the Workflow tool is
#                               unavailable in the session.
#
#                               Iteration Step B, the three-round cap and Loop
#                               Exit stay in the lead on both paths: the script
#                               reviews one round and reports, it does not loop
#                               and it never edits a file.
#
# --- One behavioural difference, worth knowing before enabling it -----------
#
# On the classic path test-writer ADDS tests for coverage the refactoring lost.
# On the orchestrated path it reports those gaps and writes nothing — two agents
# writing files inside one fan-out is a race, and a reviewer that silently
# closes the gap it found leaves nothing to audit. The lead authors them in
# Iteration Step B instead. Same coverage, one step later, and visible.
#
# --- Example ---------------------------------------------------------------
#
#   refactor:
#     workflow:
#       enabled: true
#


# UPDATE DOCUMENTATION  (optional — omit and /update-documentation is unchanged)
# =============================================================================
#
#   update_documentation.workflow.enabled
#                               Whether /update-documentation may take the
#                               orchestrated (workflow) path for Phase 4. Each
#                               gap in the prioritized list gets its own
#                               draft-then-verify chain with no barrier between
#                               the stages, so N documents cost the slowest
#                               single chain rather than the sum. A cross-document
#                               consistency pass runs once at the end — the one
#                               place a barrier is correct.
#                               Default: true. Setting false always falls back to
#                               the classic prose path, which remains fully
#                               supported. Skipped automatically when the Workflow
#                               tool is unavailable in the session.
#
#                               The scope questions, the Phase 3.2 plan
#                               confirmation and EVERY file write stay in the lead
#                               on both paths.
#
# --- What the orchestrated path changes ------------------------------------
#
# On the classic path doc-writer edits the documentation files directly, so a
# claim that no longer matches the code is on disk before anything checks it —
# and Phase 5.1 compares documents against EACH OTHER, not against the source.
#
# Here doc-writer returns a draft and writes nothing. A verify stage reads each
# claim against the file it cites, and a claim the code does not support is
# REJECTED rather than written. That means this path can decline an update the
# classic path would have applied: the document stays stale and the run says so,
# which is the trade this buys. The lead applies the accepted drafts afterwards.
#
# --- Example ---------------------------------------------------------------
#
#   update_documentation:
#     workflow:
#       enabled: true
#


# =============================================================================
# IMPLEMENT  (optional — omit entirely and /implement behaves exactly as before)
# =============================================================================
#
#   implement.workflow.enabled  Whether /implement may take the orchestrated
#                               (workflow) path for its Phase 4 QA panel: the
#                               reviewers read the diff blind, every finding is
#                               put to three challengers, and the quality-gate
#                               decision at 4.7.4 becomes arithmetic over
#                               verified findings instead of a prose reading.
#                               Default: true. Setting false always falls back to
#                               the classic prose path, which remains fully
#                               supported. Skipped automatically when the
#                               Workflow tool is unavailable in the session.
#
#                               NOTHING that mutates moves. Chunk commits, the
#                               push, gh pr create, worktree entry and exit, the
#                               manifest write, the auto-fix in 4.7.2 and every
#                               checkpoint question all stay in the lead on both
#                               paths. Only the review fan-out, the skeptic and
#                               the per-gate resolution move.
#
# --- What the orchestrated path changes -------------------------------------
#
# On the classic path the lead merges QA findings by hand at THREE points — 4.1.5,
# 4.3 and 4.7.1 — and each is a prose judgment where a finding can be softened or
# dropped without a trace. 4.7.4 then reads whatever survived. Here the merge
# happens once, mechanically, and the gate counts verified critical findings.
#
# One behavioural difference: test-writer and playwright-engineer REPORT coverage
# gaps rather than writing tests, because a file write inside the fan-out is a
# race. The lead authors them in 4.7.2 — including on the PASS path, which is the
# case the classic path covers and a naive port would lose.
#
# --- Example ---------------------------------------------------------------
#
#   implement:
#     workflow:
#       enabled: true
#

# BRAINSTORM  (optional — omit entirely and /brainstorm behaves exactly as before)
# =============================================================================
#
#   brainstorm.workflow.enabled Whether /brainstorm may take the orchestrated
#                               (workflow) path for Phase 3. Approaches are
#                               generated INDEPENDENTLY, one agent per declared
#                               angle (mvp-first, risk-first, user-first,
#                               cost-first), then scored by three judges on four
#                               declared criteria, then synthesized from the
#                               winner while grafting the best ideas from the
#                               runners-up.
#                               Default: true. Setting false always falls back to
#                               the classic single-pass path, which remains fully
#                               supported. Skipped automatically when the Workflow
#                               tool is unavailable in the session.
#
#                               The USER still chooses at 3.3. The script scores
#                               and recommends; it never decides. Phase 1 capture,
#                               the Phase 4 refine loop, every write under the
#                               brainstorms artifact and the manifest all stay in
#                               the lead.
#
# --- Why a judge panel rather than one generator ---------------------------
#
# On the classic path one agent produces two or three approaches in a single
# pass, so they share its priors: the second is usually the first with a knob
# turned. You cannot get genuine variety by asking one generator for variety.
#
# Here each approach is generated from a declared angle by an agent that cannot
# see the others, and the synthesis step grafts across real rivals — which a
# single-pass generator cannot do at all, having never had any. The scoring is
# arithmetic over recorded per-judge rows, so the ranking can be recomputed by
# hand and disagreed with by number rather than by verdict.
#
# --- Example ---------------------------------------------------------------
#
#   brainstorm:
#     workflow:
#       enabled: true
#


# =============================================================================
# Feedback (/feedback)
# =============================================================================
#
#   feedback.plugin_repo         GitHub repo the retrospective issue is filed
#                                against, as owner/repo. Default: none — Phase 7
#                                is skipped entirely and says so.
#
#   feedback.workflow.enabled    whether to use the orchestrated analysis path
#                                (two blind analysts, adversarial verification
#                                of every scored deduction, and a score that is
#                                arithmetic over what survived) when it is
#                                available. Default: true. Setting false always
#                                falls back to the classic prose path.
#
# --- What the orchestrated path changes -------------------------------------
#
# On the classic path the 100-point score is one agent reading two prose
# analyses and writing a number. On the orchestrated path a deduction only
# reaches the scorecard if the artifact it cites actually contains the line it
# quotes, and the points figure is looked up from the rubric rather than
# authored by an agent. A run it cannot verify comes back unscored and says so,
# rather than publishing a number nothing checked.
#
# Turn it off if you want the cheaper single-pass report: the orchestrated path
# dispatches five agents and sends them the session artifacts.
#
# --- Example ---------------------------------------------------------------
#
#   feedback:
#     plugin_repo: my-org/my-plugin-repo
#     workflow:
#       enabled: true
#
# =============================================================================
